name: Release

# Pushing a tag such as v1.0.0 builds, tests and publishes a GitHub Release.
# Running it by hand (Actions > Release > Run workflow) does everything except publish.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      # The tag must be v<version> for the version in package.json; the installer is named after it.
      - name: Check the version against the tag
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            node scripts/check-version.mjs "$GITHUB_REF_NAME"
          else
            node scripts/check-version.mjs
          fi

      - name: Install the dependencies in the lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Run the unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Only a development build honours a feed served from this computer; the packaged app never
      # does. So this is where the whole update flow is tried for real: find, download, check the
      # hash, announce, switch off. It starts the app from the repository, which needs the build above.
      - name: Try updating against a feed on this computer
        run: npm run test:e2e -- updates

      - name: Build the installer and the portable executable
        run: npm run dist

      - name: Verify the build output
        run: npm run verify:release

      - name: Run the end-to-end tests against the packaged application
        run: npm run test:e2e
        env:
          MDREADER_EXE: ${{ github.workspace }}\release\win-unpacked\MDReader.exe

      - name: Check that the portable executable opens a document
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/portable-smoke.ps1 -Portable "release/MDReader-Portable-$env:VERSION.exe"

      # The installer is tested by really installing it, over an older version, as a user would.
      - name: Build an older installer to upgrade from
        run: npx electron-builder --win nsis --x64 --publish never --config.extraMetadata.version=0.0.1 --config.directories.output=release/previous

      - name: Install the new version over the older one and check the installation
        id: install
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          ./scripts/installer-test.ps1 -Phase Install
          -Installer "release/MDReader-Setup-$env:VERSION.exe"
          -PreviousInstaller "release/previous/MDReader-Setup-0.0.1.exe"

      - name: Run the end-to-end tests against the installed application
        run: npm run test:e2e
        env:
          MDREADER_EXE: ${{ steps.install.outputs.exe }}

      - name: Uninstall and check that nothing is left behind
        shell: pwsh
        run: ./scripts/installer-test.ps1 -Phase Uninstall

      - name: Write the checksums
        run: npm run checksums

      - name: Keep the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: md-reader-release
          path: |
            release/MDReader-Setup-*.exe
            release/MDReader-Setup-*.exe.blockmap
            release/MDReader-Portable-*.exe
            release/SHA256SUMS.txt
            release/latest.yml
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish the GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: md-reader-release
          path: dist

      - name: Verify the checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum --check SHA256SUMS.txt

      # Creating fails when a release for the tag already exists; nothing is overwritten or deleted.
      - name: Create the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          cat > notes-header.md <<'EOF'
          Download **MDReader-Setup** to install MD Reader for your Windows user account (no administrator rights needed). **MDReader-Portable** runs without installing.

          Installed with **MDReader-Setup**, MD Reader keeps itself up to date from version 1.1.0 on: it installs a new version when you close the app. The portable executable only tells you when a newer version exists. `latest.yml` and the `.blockmap` file are what installed copies read to do that; you do not need them.

          These builds are not code-signed, so Windows SmartScreen may say "Windows protected your PC" the first time. Choose **More info**, then **Run anyway**. To check a download, compare `Get-FileHash -Algorithm SHA256 <file>` with `SHA256SUMS.txt`.
          EOF

          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi

          gh release create "$TAG" \
            --verify-tag \
            --title "MD Reader $TAG" \
            --notes-file notes-header.md \
            --generate-notes \
            "${flags[@]}" \
            MDReader-Setup-*.exe MDReader-Setup-*.exe.blockmap MDReader-Portable-*.exe \
            SHA256SUMS.txt latest.yml
