name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install the dependencies in the lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Run the unit tests
        run: npm test

      - name: Build
        run: npm run build

      # npm does not run Electron's install script here (it warns that install scripts are skipped), so
      # the Electron binary that a development build starts is fetched explicitly.
      - name: Download Electron
        run: node node_modules/electron/install.js

      # Only a development build honours a feed served from this computer; the packaged app never
      # does. So this is where the whole update flow is tried for real: find, download, check the
      # hash, announce, switch off. It starts the app from the repository, which needs the build above.
      - name: Try updating against a feed on this computer
        run: npm run test:e2e -- updates

      - name: Package the application
        run: npm run pack

      - name: Verify the packaged application
        run: npm run verify:release -- --unpacked-only

      - name: Run the end-to-end tests against the packaged application
        run: npm run test:e2e
        env:
          MDREADER_EXE: ${{ github.workspace }}\release\win-unpacked\MDReader.exe
